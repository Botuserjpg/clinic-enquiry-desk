name: Clinic Enquiry Desk checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/evaluate.py --report docs/evaluation_report.md
      - run: python tools/build_browser_rules.py
      - run: find . -path './.git' -prune -o -path './node_modules' -prune -o -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm test
      - run: python -m unittest discover -s tests -v
